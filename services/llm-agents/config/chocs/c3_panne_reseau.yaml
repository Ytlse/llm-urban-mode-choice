# C3 — Network outage · public transport
# The only case that naturally reaches the missed connection: 0.50 (saturated delay) + 0.20
# (connection) + 0.20 (incident) = 0.90 severity, i.e. 17.9 days of lifetime.
# This is the shock chapter 7 announces.
choc: c3_panne_reseau
libelle: "Metro network failure"
source: "scénario déclaré — van Exel & Rietveld (2001), Transport Policy 8(4)"

# CADENCE ADDED on 2026-09-22, before the attribution campaign. Without this line the cadence
# is `trajet`: a network outage declared once applied to EACH of the day's public transport
# trips. 861500 makes one to two a day — he would therefore have
# "missed the appointment he was heading to" twice in the same day, with two
# judgements and two memories of severity 0.75 where the protocol declares one.
# It is the EXACT defect c6 had paid for on 2026-09-19 (four thirty-minute breakdown repairs instead
# of one), fixed there by the same line. The four other cases of 079 — c1, c2, c4, c5 — received it
# on 2026-09-24.
cadence: jour

exposition:
  regle: mode
  modes: [public_transport]

jours:
  - jour: 12
    retard_min: 28
    incident_reseau: true
    correspondance_ratee: true
    vecu: >-
      The metro stopped between two stations and the lighting went out. No announcement was made
      for 25 minutes. When the service restarted the carriage was packed full. I missed the
      appointment I was travelling to, and arrived 28 minutes after the time I had planned. It is
      the fourth time this month that this line has stopped.
  - jour: 13
    retard_min: 20
    incident_reseau: true
    vecu: >-
      The line ran at reduced frequency all morning. Three trains passed at full capacity before I
      could board one. I arrived 20 minutes late.
