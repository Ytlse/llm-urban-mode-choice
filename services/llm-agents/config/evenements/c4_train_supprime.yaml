# ══ MIGRATED TO THE TICKET 100 FORMAT (single channel) on 2026-09-21 ═════════════════════
# `choc:` becomes `evenement:`, and three fields appear. They change NOTHING in what this
# file did: `canal: vecu` and `moment: arrivee` are the suffered regime of ticket 079, and
# `jugement: aucun` is the state before lot 3 — the agent does not judge yet what they suffer.
# The golden test of lot 1 replays the original from `config/chocs/` and requires the same trace.
# C4 — Cancelled train · train
# Few agents concerned, high severity. Exposure by mode is enough: only the trips
# including a rail leg report `train` as the main mode.
evenement: c4_train_supprime
canal: vecu                  # vecu | lu — where the text comes from
moment: arrivee              # arrivee (after the decision) | reveil (before)
jugement: aucun              # aucun | a_l_injection (lot 3 of ticket 100)
# At most one application per agent and per day (ticket 100, § 13.2 point 9, 2026-09-24).
# Without this line, the default `trajet` cadence injected the event at EACH trip
# of the targeted mode on the same day — the defect that cost a measurement on c6 on 19/09.
cadence: jour
libelle: "Regional train cancelled"
source: "scénario déclaré"

exposition:
  regle: mode
  modes: [train]

jours:
  - jour: 12
    retard_min: 50
    incident_reseau: true
    vecu: >-
      My regional train was cancelled. No reason was given, and no replacement time was announced
      for 30 minutes. I waited 50 minutes on the platform for the next service.
