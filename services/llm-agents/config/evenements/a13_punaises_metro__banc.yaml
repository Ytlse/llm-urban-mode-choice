# ⚠ TEST-BENCH VARIANT — ticket 095/100, short run of the LU channel, 2026-09-22.
#
# Identical to `a13_punaises_metro` EXCEPT the publication window: days 1-2 instead of 9-13, so
# that the article reaches its readers in a four-day run. It serves to prove the PATH
# of the `lu` channel end to end — injection at WAKE-UP, judgement at injection, double write
# STM + LTM, evening narrative, household block — that only the functional bench had exercised so far,
# by calling the functions directly.
#
# ⚠ It DOES NOT REPRODUCE the protocol: a two-day window does not spread the reading
# dates, and that is precisely what the five-day window of the real case is for.
#
# DO NOT USE FOR A CAMPAIGN.
#
# Bed bug scare on the metro — `lu` channel, injection at wake-up
#
# Ticket 100 (single channel), corpus of ticket 059 lot 1. The article is CITED, never rewritten:
# its fingerprint is checked at loading against this declaration AND against the manifest of the
# corpus. Two comparisons, because a file and its declaration can move together.
#
# WHY THE PUBLICATION DAY IS DRAWN. If all households read on the same morning, the effect of
# the article and the effect of the calendar — a Monday, the eve of a holiday, a rainy day —
# would be strictly inseparable. The day is therefore drawn per HOUSEHOLD, with a fixed seed: two
# households do not read on the same morning, and the replay stays identical.
#
# WHY A SINGLE READER PER HOUSEHOLD (059, Q2). The co-resident not drawn is the INTERNAL CONTROL
# of the set-up. If everybody read, there would be nobody left in whom to observe what
# is passed on — and the diffusion stage would lose its purpose.
#
# ⚠ THIS FILE DOES NOT ARM A RUN YET. `jugement: a_l_injection` arrives in lot 3: without it,
# the article enters with a severity of 0.00, lives 2.8 days, and its silence would pass for an
# absence of effect. The declaration can be checked right now (fingerprints, households, window);
# it is played in lot 3.
#
# TRANSLATION. The articles are French press texts; the set-up has been in English
# since ticket 074. The mention "Translated from French" is carried INSIDE
# the entry, visible to the model: it is information the agent has, and there is no need to hide it
# from them.

evenement: a13_punaises_metro__banc
libelle: "Bed bug scare on the metro"
source: "presse locale toulousaine — archivé sous articles_html/13_psychose_punaises_metro.html"

canal: lu                      # the agent READ it, they did not suffer it
moment: reveil                 # BEFORE the first decision of the day
jugement: a_l_injection        # the agent judges what they have just read (lot 3)

texte:
  fichier: data/presse/articles_txt/a13_punaises_metro/brut.txt
  sha256: "fc3551256f99c5d467482df05e1df737592e3365a5c174432aa0389638341393"
  mention: "Translated from French"

calendrier:
  fenetre_jours: [1, 2]   # ⚠ TEST-BENCH VARIANT: the window of the real case is [9, 13]
  graine: 59

exposition:
  regle: foyers
  # The SIX households declared "exposé" in the MANIFEST of population_20_foyers_059 (ticket 059,
  # lot 6). They are not chosen here: copying them by hand would make them diverge from the
  # manifest the day the population moves, and nobody would see it.
  # The four control households — 231569, 602079, 497875, 199718 — are in the SAME file, hence
  # in the same run: the noise floor measured in ticket 095 is not zero, and a control
  # launched separately would enter the measured effect.
  foyers: ['605813', '234839', '471076', '538432', '73563', '625551']
  lecteurs_par_foyer: 1
  graine: 59

cadence: jour                  # an article is read once

# Ticket 111 — the article is GUARANTEED in the prompt for 5 travel days (weekends excluded,
# the reading day counts as day 1), whatever the judged severity: the decision of the reading
# day is precomputed the day before, and a severity below `memoire__importance_choc` left
# the article outside the "What changed recently" block. Afterwards, memory decides alone.
service:
  jours_de_deplacement: 5
# The reader writes one message per member of their household, or chooses to say nothing; for a
# minor, the message is the parents' decision (ticket 111, D5).
relais:
  mode: par_destinataire
