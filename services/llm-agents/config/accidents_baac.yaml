# Accident law of ticket 070, estimated on BAAC/ONISR.
#
# MEASURED on 2026-09-14 on the 2019-2024 vintages, département 31, by
# docs/traces/2026-09-14_20-40_loi_accidents_baac/mesure_loi_accidents.py (replayable).
# Source: data.gouv.fr, Licence Ouverte. 3,789 injury accidents read, 3,414 within
# the footprint of the simulated graph, none without geolocation.
#
# WHAT REQUIRES A DENOMINATOR AND WHAT DOES NOT — the distinction governs
# this whole file. The hour, the day and the road class are DRAWN by the simulation: the
# marginal distribution of the observed accidents is exactly what is needed, and dividing
# by traffic would be a mistake (we would get the risk per vehicle-km, which would make
# as many accidents happen at 3 a.m. as at 5 p.m.). The weather, on the other hand, is IMPOSED by the
# day's bulletin: it would call for a relative risk, hence a denominator.

source: BAAC / ONISR — data.gouv.fr, Licence Ouverte
millesimes: [2019, 2020, 2021, 2022, 2023, 2024]
departement: '31'
mesure_le: '2026-09-14'
accidents_lus: 3789
accidents_dans_emprise: 3414

# Injury accidents per day WITHIN THE GRAPH FOOTPRINT (scope of the 453 communes),
# and not over the whole département: 90.1% of the accidents of the 31 fall there. The former
# seed value, 1.73/day, was that of the whole département — it overestimated.
taux_base_par_jour: 1.5578

