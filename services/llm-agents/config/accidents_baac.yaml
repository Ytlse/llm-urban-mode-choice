# ── Speed-limit class: DRAWN distribution, sum 1 ──────────────────────────────────
# Filled in for 97.9% of the accidents (`vma` of the lieux file). Each edge of the graph
# carries a speed, hence no mapping table to invent.
#
# The contrast with the length of the network is the most telling result of the measurement,
# and it alone justifies the conditioning: the 71-90 km/h class carries 27.3% of the
# accidents for 4.4% of the kilometres, while the ≤ 30 km/h class carries 8.0% of the
# accidents for 58.1% of the kilometres. Drawing an edge in proportion to its length, as
# the first slice did, therefore placed 58% of the accidents in traffic-calmed zones.
distribution_classe_vitesse:
  '<=30': 0.079515
  '31-50': 0.574663
  '51-70': 0.042049
  '71-90': 0.272507
  '>90': 0.031267

# Kilometres of the `drive` graph per class — CHECK, not denominator. Used to verify
# that a drawn class does exist in the simulated network: a class without kilometres is
# an accident impossible to place, and that must be heard rather than kept silent.
km_reseau_par_classe:
  '<=30': 17750.6
  '31-50': 10350.3
  '51-70': 660.8
  '71-90': 1350.2
  '>90': 431.3

# ── Weather: THE DECISION IS TAKEN — the factor equals 1, for good ────────────────
#
# Author's decision of 2026-09-21: the weather does NOT condition accidents in this
# set-up. It is not a work item postponed until later, it is a deliberate limitation, and here
# is what it rests on — two reasons, the second of which would be enough on its own.
#
# REASON 1 — THE RISK CONDITIONS DO NOT EXIST IN THE SIMULATED WORLD.
# Measured on 2026-09-21 on `data/weather/meteo_toulouse_12_mois.csv`, the ONLY file that
# `weather_loader` reads (trace 2026-09-21_meteo_servie_par_la_simulation, replayable script).
# Over the 2,920 three-hour slots of a served year:
#     fog             1 slot      (0.03%)    — on 30 August, outside any season
#     snow / sleet    4 slots     (0.14%)
#     actual rain   239 slots     (8.18%)
#     POSSIBLE rain 422 slots     (14.45%)   — code 176, a FORECAST
#     overcast/mist 365 slots     (12.50%)
#     clear       1,879 slots     (64.35%)
# A fog or snow factor would therefore ALMOST NEVER trigger — and on the frozen
# set `jeu-20260316`, seven days of clear sky and one shower: it is unreachable.
# Finely estimating a coefficient for a condition absent from the dataset would be
# pointless work.
#
# REASON 2 — FOR THE CONDITIONS THAT REMAIN, THE NOMENCLATURES ARE INCOMMENSURABLE.
# `atm` is what the reporting officer ticked: 84% of the reports carry "normale",
# including under an overcast sky. The local weather source, for its part, files 14.45% of the slots
# under "possible rain nearby" — a forecast, not an observation of rain. The
# two vocabularies do not split the same world; their ratio measures nothing.
#
# WHAT THE REJECTED COMPUTATION GAVE, kept below so that the refusal can be checked:
#   normale ×1.36 · couvert ×0.17 · pluie légère ×0.47 · pluie forte ×1.23 · neige ×0.53
#   · brouillard ×33.7
# i.e. "light rain is twice as safe as the average". The ×33.7 of fog
# rests on A SINGLE observed slot: it would take 0.8 days of fog per year for it to
# hold. At any plausible frequency (10 to 50 days/year), the factor would fall between 0.25
# and 2.5 — around 1, not 34.
#
# ⚠ WHAT WOULD REOPEN THE QUESTION, and nothing else: a weather set served to the simulation that
# really carries fog, snow or a reliable rain/no-rain distinction. As long
# as the file served is this one, the factor stays at 1. Adjusting the mapping until
# plausible numbers are obtained would amount to choosing the result.
facteur_meteo_etabli: false
facteur_meteo:
  'normale': 1.0
  'temps couvert': 1.0
  'pluie légère': 1.0
  'pluie forte': 1.0
  'neige – grêle': 1.0
  'brouillard – fumée': 1.0

# What the rejected computation had produced — kept so that the rejection can be checked,
# never read by the code.
facteur_meteo_mesure_rejete:
  'normale': 1.3621
  'temps couvert': 0.1652
  'pluie légère': 0.4725
  'pluie forte': 1.2294
  'neige – grêle': 0.5269
  'brouillard – fumée': 33.7208
