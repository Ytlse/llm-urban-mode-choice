# Sensitivity grid — ticket 013, decision T6. The modal shares per distance
# band are recomputed for each of these values and the gap to EMC² is
# reported. The goal is NOT to choose the best one (that would violate T2), it is
# to know whether the conclusion depends on the setting.
sensitivity:
  # ⚠ A variant applies a uniform FACTOR on all the rings, not a
  # single value: replacing the table with a constant would make "spatialised
  # or not" vary AT THE SAME TIME as the magnitude of terminal time, and the sensitivity
  # would measure two things at once. The factors are rounded to the minute.
  low:
    car: {factor: 0.5}
    rationale: >
      Moitié des valeurs retenues — lecture Millard-Ball et al. (2020), où la
      recherche de place mesurée au GPS est quasi nulle.
  central:
    car: {factor: 1.0}
    rationale: >
      Valeurs retenues : terminal times COMPASS par type de zone + recherche de
      place encadrée par Cerema (< 5 min en centre-bourg) et Shoup (8,1 min en
      hyper-centre, majorant).
  high:
    car: {factor: 1.5}
    rationale: >
      Une fois et demie les valeurs retenues — approche la moyenne Shoup de 8,1 min
      de recherche de place sur les zones les plus tendues.
