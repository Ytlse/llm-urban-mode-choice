# Ticket 088 — the full replay on the corrected substrate.
# Written on 2026-09-16. It replaces the three campaigns of the old set
# (`bascule_anglaise_v6`, `bascule_anglaise_v6_sans_gemini31`, `multimodeles_v6`), deleted
# the same day: their `restantes` designated experiments in `jeu-20260316`, that is
# the substrate dated 17 March for 797 personas. Their definitions and states are in
# docs/traces/2026-09-16_14-24_avant_rejeu_jeu_corrige/.
#
# No Antigravity phase. Author's decision of 2026-09-16: no more Antigravity runs.
# The five `agy-*` definitions stay on the old substrate and are not derived.
nom: rejeu_jeu_corrige_v6
version: campagne1
note: 'Rejeu intégral de la cohorte v6 sur le jeu corrigé du ticket 088. Le jeu précédent portait,
  pour 797 des 894 personas mobiles, une offre d''itinéraires et une météo calculées pour le 17 mars
  au lieu du 16 : `deplacements_attendus()` ancrait le curseur sur le `start_time` d''une activité
  « home » enjambant minuit, et la règle de report datait le départ du matin du lendemain. Le correctif
  est en place ; ce que la campagne rejoue, c''est tout ce qui a été mesuré sur le mauvais substrat —
  26 exécutions terminées, plus le bras `gemini-35-fl_promin02` qui n''a jamais abouti (arrêté à
  53/3299 le 2026-09-16). Les expériences déjà `terminee` sont comptées faites et ne sont pas
  rejouées : relancer cette campagne ne refait que ce qui manque.'
