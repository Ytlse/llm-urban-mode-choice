    scikit-learn 1.8.0, le conteneur porte la 1.9.0, et les deux ne donnent pas la même forêt (mesuré,
    exactitude +0,000188). Le § 3.3 du ticket 088 — câbler la famille `rf` dans `FAMILLES` et
    `POLICY_FORMATS` — n''est PAS fait : tant qu''il ne l''est pas, ce bras passe par son lanceur,
    et l''asymétrie de parité que le § 4.4 du chapitre 4 affirme reste ouverte.'
