# ==============================================================================
# SPÉCIFICATION UNIFIÉE DU PLAN EXPÉRIMENTAL
# Projet : LLM-Agents GAMA — Mobilité Urbaine Métropole Toulousaine
# ==============================================================================

# ── 1. SOCLE COMMUN PARTAGÉ (COMMON SET) ──────────────────────────────────────
defaults:
  inputs:
    # Path to the sealed population aligned with the Cerema EMC² 2023 survey: v6,
    # sealed on 2026-09-14 (ticket 074). v5 went to cold storage.
    #
    # v6 IS v5, IN ENGLISH. Checked agent by agent against the archive: the same
    # 1,000 `person_id`, the same 499 households, and 0 different activity chains out of
    # 1,000 — purposes, times and places included. Only six fields change:
    # `main_occupation`, `housing_type`, `personal_bike`, `residence_zone` and
    # `travel_purposes` switch to English, and the first names are now drawn from a
    # seed per `person_id` instead of the clock.
    #
    # CONSEQUENCE FOR GUARD D-7: the 14 deterministic controls read no
    # prompt and see an identical substrate. They stay comparable WITHOUT being replayed.
    population_file: "data/population/population_1000_PANEL_v6/population.json"
    population_hash: null  # Will be filled in automatically with the sha256 hash at freezing; v6 seal: 412efada802f79e8a72976ba25e0c7db8c9404adaed7c1f5e3e3d6afa3531db6 (v5 archived: de73532e82c84f62eb72c8a614f3c27767bf5cca1d1574d3574f4a96b65bd8ce)
    reference_survey: "scripts/data/population/cerema_values.yaml"
    oracle_lightgbm: "scripts/progedo_logit/mode_choice_policy.json"
    feature_spec: "scripts/progedo_logit/feature_spec.json"
    otp_cache_dir: "data/cache/otp"
    # Unit of evaluation = the trip. The sealed cohort has 1,000 PEOPLE;
    # the number of trips is derived from their activity chains, which are CYCLIC:
    # the first « home » activity starts the evening before and the last trip brings back
    # home, so a chain of k activities carries k trips, and not k − 1.
    # Measured on population_1000_PANEL_v6: 1,000 people, 894 mobile, 3.30 trips/person
    # — the same three figures as v5, the cohort being the same.
    # Recomputed automatically at hash freezing (may vary slightly from one version to the next).
    person_count: 1000
    trip_count: 3299       # somme(activités − 1) = 2 405, + 894 mobiles (dérivé, non fixé à la main)

  # Scope of the 4 canonical transport modes (EMC² 2023 survey)
  # Any finer mode generated in simulation is aggregated into these 4 classes for scoring
  canonical_modes:
    - "Voiture"
    - "Transports en commun"
    - "Marche"
    - "Vélo"

  scoring:
    macro_metrics:
      - "emd"              # Earth Mover's Distance pour variables ordinales (âge, distance)
      - "jsd"              # Jensen-Shannon Divergence pour variables qualitatives (motif, genre)
      - "l1_composite"     # Erreur L1 composite lisible en points de %
    micro_metrics:
      - "accuracy"         # Exactitude individuelle vs choix réel et oracle
      - "log_loss"         # Perte logarithmique (calibrage des probabilités)
      - "confusion_matrix" # Matrice de confusion 4x4 (Voiture, TC, Marche, Vélo)
    strata:
      - "distance"
      - "motif"
      - "age"
      - "genre"
      - "couronne"
    # ── Uncertainty quantification (no metric is published as a bare point estimate) ──
    uncertainty:
      # The trips of the same agent are not independent (same household, car ownership,
      # location). The CI is therefore computed by resampling the AGENTS, not the trips.
      cluster_bootstrap:
        enabled: true
        cluster_unit: "agent"        # ré-échantillonnage par grappe agent
        resamples: 1000
        ci_level: 0.95
        applies_to: ["emd", "jsd", "l1_composite", "accuracy", "log_loss"]
      # Paired contrasts (same agents across conditions): Phases 4 (hysteresis) and 5 (press).
      paired_test:
        method: "mcnemar"            # bascule modale appariée entre deux bras
        applies_to_phases: ["phase_4_hysteresis", "phase_5_presse_locale"]
      # Calage macro vs cibles EMC² : test d'ÉQUIVALENCE (borne d'indifférence annoncée),
      # pas de χ² de non-significativité (cf. PROTOCOLE_SCIENTIFIQUE §2.2).
      equivalence_test:
        method: "tost"
        indifference_margin_pp: 1.0  # ± 1 point de pourcentage
      # Randomisation de l'ordre des options OTP (anti-biais de primauté, Tier 2 SILICA).
      option_order_seed: 42

  # ── Ratios & Quotas de référence de la passerelle SWRR (Source: quotas_summary.html) ──
  gateway_quotas_reference:
    summary_file: "../llm-agents-gama-papiers/methode/quotas_summary.html"
    providers_config: "config/llm_gateway/providers.yaml"
    batch_target_agents: 10            # Cible nominale de dispatch (Settings.batch_target_agents)
    gateway_budget_tokens_per_agent: 3000 # 2200 in + 800 out (garde-fou passerelle réservation glissante)
    daily_quotas_rpd:
      google_gemini31_key1: 500             # Juge d'évaluation (thinking: 0)
      google_gemini35_key1: 500             # Mutateur (+ thinking 1024)
      google_gemini31_key2: 500                     # Seconde clé Google
      mistral: "illimité (garde-fou 100M tokens/j)"
    measured_ratios:
      char_to_token_ratio: 3.0         # 3.0 à 3.2 caractères / token en FR + JSON
      prompt_tokens_per_trip: 750      # Mesuré sur batchs réels (batch_196 à 199)
      reply_tokens_per_trip: 230       # Probabilités exhaustives + phrase reason

  outputs:
    archive_dir: "experiments/archive"
    dashboard_page: "docs/synthesis/index.html"
    export_latex: true     # Generates the LaTeX line for the big table of the paper

# ── 2. FULL MATRIX OF EXPERIMENTS ───────────────────────────────────────
# `id` is the PAPER's identifier: it carries the phase and the order of the sections, and does not change.
# `nom_runtime` is the name the platform COMPUTES from its parameters (spec
# `nommage-canonique-experiences`) and under which the experiment lives in data/experiences/;
# it is only filled in for those that have already run.
