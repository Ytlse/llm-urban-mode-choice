    title: "Hasard Uniforme sur Offre OTP"
    phase: "phase_0_planchers"
    description: "Tirage équiprobable parmi les modes alternatifs proposés par OTP pour chaque trajet."
    engine:
      type: "heuristic"
      rule: "random_choice"
      temperature: 0.0
      seed: 42
    execution:
      batch_size: 1000
    estimation:
      requests_unbatched: 0             # Calcul purement local / interne
      batch_count: 0
      tokens_input: 0
      tokens_output: 0
      cost_usd: 0.0

  - id: "exp_00b_majority_car"
    nom_runtime: "exp_majvoiture_nosim"   # dossier data/experiences/ (nom calculé)
    title: "A priori empirique (Mode majoritaire — Voiture)"
    phase: "phase_0_planchers"
    description: "Sélectionne systématiquement l'option Voiture si disponible dans l'offre OTP, sinon repli."
    engine:
      type: "heuristic"
      rule: "majority_car"
      temperature: 0.0
      seed: 42
    execution:
      batch_size: 1000
    estimation:
      requests_unbatched: 0
      batch_count: 0
      tokens_input: 0
      tokens_output: 0
      cost_usd: 0.0

