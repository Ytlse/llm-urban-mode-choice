  # PHASE 3 : PLAFOND TABULAIRE SUPERVISÉ (Section 4.1 & 4.3)
  # ============================================================================

  - id: "exp_03a_multinomial_logit"
    title: "Multinomial Logit (MNL McFadden)"
    phase: "phase_3_baselines_statistiques"
    description: "Référence économétrique estimée sur les microdonnées ProGEDO / EMC² 2023, à parité stricte avec l'oracle : les 21 variables du contrat, même split par ménage, mêmes métriques."
    # Estimated on 2026-09-10 (ticket 042, `make logit`): the model_path finally exists.
    # Sealed test of 13,045 trips, COEP-weighted: accuracy 0.766, CEL 0.5954,
    # GMPCA 0.551, mass L1 0.0286, chosen-mode L1 0.1003 — below the booster on BOTH
    # families of indicators (0.785 / 0.0269 / 0.0730). The inversion described by
    # Martín-Baos et al. (2023) does not occur on these data: the reference ceiling
    # is indeed the supervised oracle, and it is no longer a hypothesis.
    #
    # ⚠ This is NOT a random utility model: the contract carries no cost or
    # level-of-service variable per mode. Neither VOT nor WTP come out of it — a limit to
    # declare in chapter 2, cf. docs/tickets/ticket_042_*.md.
    engine:
      type: "tabular_ml"
      model_path: "scripts/progedo_logit/mnl_model.json"
      renormalize_on_otp_offer: true
      seed: 42
    execution:
      batch_size: 1000
    estimation:
      requests_unbatched: 0
      batch_count: 0
      cost_usd: 0.0

