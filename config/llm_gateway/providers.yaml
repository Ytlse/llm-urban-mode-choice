# config/llm_gateway/providers.yaml — DEPLOYMENT configuration of the providers (outside the llm_gateway package).
# Definition of the available LLM providers.
#
# Required fields : rpm_limit, base_url, default_model
# Optional fields : tpm_limit, rpd_limit, tpd_limit, weight (default 1.0),
#                   disable_timeout (default 180s), adapter (default = provider name),
#                   max_tokens_per_request (provider excluded if < batch_max_agents ×
#                   settings.assumed_prompt_tokens + settings.min_output_tokens),
#                   max_output_tokens (the model's completion ceiling — the max_tokens
#                   param sent to the provider is capped by this value; absent =
#                   fallback settings.max_output_tokens. SELF-ADJUSTED: if the provider
#                   answers HTTP 400 "`max_tokens` must be less than or equal to N",
#                   the worker learns N, updates this file and retries the batch.
#                   The load balancer also discards providers whose max_output_tokens
#                   < a task's output budget.)
# batch_max_agents is computed automatically: max(1, min(tpm_limit/tokens_per_agent, rpm_limit, max_batch_agents))
#
# DAILY QUOTAS: rpd_limit (requests/day) and tpd_limit (tokens/day) are
# ENFORCED (cf. infra/*/rate_limiter.py). As soon as a provider reaches its quota,
# it is removed from the rotation until midnight UTC (UTC daily window), instead
# of being retried every disable_timeout seconds. rpm_limit and
# tpm_limit (60 s sliding window) remain enforced in parallel.
#
# For several instances of the same provider,
# use distinct names and fill the `adapter` field with the name of the base
# provider. The API key is inherited automatically via PROVIDER_KEYS__<adapter>.
#
# WEIGHT CONVENTION (weight): proportional to the provider's effective capacity,
#   weight = min(rpm_limit, tpm_limit / 3000) / 15
# where 3000 ≈ tokens (in+out) of an average request and 15 = reference RPM (weight 1.0).
# For small-TPM providers, it is the TPM that bounds the real throughput, not the RPM
# (e.g. groq_openai_120_key1 at 30 RPM but 8,000 TPM only sustains ~2.7 req/min).
# Recompute the weight at every change of rpm_limit/tpm_limit.
# (Realigned on 2026-07-10: the historical weights were uncorrelated with the quotas —
# mistral, 47 % of total capacity, received only ~8 % of the traffic.)

providers:

  #
  # ── OpenAI ───────────────────────────────────────────────
  #
  # Enabled on 2026-09-18: PROVIDER_KEYS__openai key provided.
  # Quotas measured from the OpenAI API's HTTP headers on 2026-09-18:
  # 50 req/min (x-ratelimit-limit-requests) and 100,000 tokens/min (x-ratelimit-limit-tokens).
  # Reasoning model gpt-5.6-luna (max_completion_tokens, default temperature).
  openai_gpt56_luna_key1:
    adapter:           openai
    rpm_limit:         50
    tpm_limit:         100000
    base_url:          https://api.openai.com/v1
    default_model:     gpt-5.6-luna
    max_output_tokens: 16384
    weight:            2.2   # min(50, 100000/3000)/15 = 2.2
    concurrency_limit: 2

  #
  # ── Mistral ───────────────────────────────────────────────
  #
  mistral_key1:
    adapter:           mistral   # required: the instance name no longer serves as adapter (suffix _key1)
    rpm_limit:         60  # 1 req/s (free tier doc) — the headers announce more, capped out of caution
    tpm_limit:         500000  # verified 2026-08-03 (x-ratelimit headers)
    tpd_limit:         100000000  # SAFEGUARD: 3× the daily pro rata of the monthly free tier quota (1 bn tokens/month)
    base_url:          https://api.mistral.ai/v1
    default_model:     mistral-small-latest
    weight:            4.0   # min(60, 500000/3000)/15 = 4.0 — updated 2026-08-03
    # 3 (and not 5): 5 workers fought over the queue and emptied it in pops of
    # 1 task (run 2026-07-10: 2.06 agents/prompt for a ceiling of 20). Fewer
    # workers = bigger pops, same throughput (the RPM 90 is far from saturated).
    concurrency_limit: 3

  # Mistral Large 3 (2026-09-10). ITS OWN quota bucket, measured from the headers on the day
  # it was added: 30 req/min and 800,000 tokens/min, whereas mistral-small-latest on the SAME key
  # announces 1,000 req/min and 500,000 tokens/min. Per-minute limits are therefore counted
  # per model — this instance takes nothing away from mistral_key1. Only the MONTHLY bill
  # (1 bn free tier tokens) is shared by both, hence a daily safeguard at the plain
  # pro rata (33 M) and not at triple as for mistral_key1.
  mistral_large3_key1:
    adapter:           mistral
    rpm_limit:         30   # x-ratelimit-limit-req-minute header, measured 2026-09-10
    tpm_limit:         800000  # x-ratelimit-limit-tokens-minute header, measured 2026-09-10
    tpd_limit:         100000000  # SAFEGUARD: daily pro rata of the monthly quota, SHARED with mistral_key1
    base_url:          https://api.mistral.ai/v1
    # The DATED ID, not the alias `mistral-large-latest`: an alias moved onto another model
    # would make an experiment's sealed fingerprint carry a wrong model name, without
    # anything flagging it (incident of 2026-09-10 on `gemini-3.1-flash-lite-preview`,
    # detected by _refuser_substitution_de_modele).
    default_model:     mistral-large-2512
    weight:            2.0   # min(30, 800000/3000)/15 = 2.0
    concurrency_limit: 2   # 30 req/min: opening more workers only makes them wait

  #
  # ── Google ───────────────────────────────────────────────
  #
  google_gemini31_key1:
    adapter:           google
    # Daily quota reset in Pacific time, NOT in UTC: the Gemini billing day
    # ends at 09:00 in Paris (in summer). Counting in UTC
    # emptied the counter 7 h too early (incident of 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500    # daily request quota (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    # `-preview` REMOVED: the alias was served by `gemini-3.1-flash-lite` without anything
    # flagging it, and the sealed fingerprint therefore carried a wrong model name (incident
    # of 2026-09-10, detected by _refuser_substitution_de_modele). The EFFECTIVE model has
    # not changed — only its name is exact again.
    default_model:     gemini-3.1-flash-lite
    weight:            1.0   # min(15, 250000/3000)/15 = 1.0
    concurrency_limit: 2   # batches of 40 agents = already very dense, no point increasing
    disable_timeout:   120

  # Quotas read from the AI Studio dashboard (free tier, 2026-07-27): RPM 15 ·
  # TPM 250,000 · RPD 500 — identical to google_gemini31_key1, but counted in
  # a SEPARATE QUOTA BUCKET. That is the whole point: by dedicating gemini31 to
  # evaluation and gemini35 to mutation, the campaign has 500 + 500
  # requests/day instead of 500 shared.
  # gemini-3.5-flash-lite is also the announced successor of gemini-3.1-flash-lite
  # (shutdown planned 2027-05-07), hence the eventual migration target of the eval model.
  google_gemini35_key1:
    # Levels taken from ai.google.dev/gemini-api/docs/thinking (2026-09-10).
    thinking_levels:        [minimal, low, medium, high]
    adapter:           google
    # Daily quota reset in Pacific time, NOT in UTC: the Gemini billing day
    # ends at 09:00 in Paris (in summer). Counting in UTC
    # emptied the counter 7 h too early (incident of 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500    # daily request quota (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemini-3.5-flash-lite
    weight:            1.0   # min(15, 250000/3000)/15 = 1.0
    concurrency_limit: 2
    disable_timeout:   120

  # ── Second Google key (PROVIDER_KEYS__google2) ────────────────────────────
  # Free tier quotas counted PER PROJECT AND PER MODEL (quotaId
  # "GenerateRequestsPerDayPerProjectPerModel-FreeTier"): a key attached to another
  # project therefore has its own 500 requests/day per model.
  #
  # USE RESERVED FOR MEASUREMENTS OUTSIDE THE CAMPAIGN (pre-tests, calibrations). Do not
  # switch the campaign onto it: eval_provider enters eval_params_key(), so
  # changing provider — even with an identical model — restarts from an empty cache.
  #
  # Key resolution is `provider_keys[nom_instance] or provider_keys[adapter]`
  # (packages/llm_gateway/src/llm_gateway/config/settings.py). The instance name MUST therefore match the env
  # variable, otherwise it silently falls back on PROVIDER_KEYS__google (key 1).
  google_gemini31_key2:
    adapter:           google
    # Daily quota reset in Pacific time, NOT in UTC: the Gemini billing day
    # ends at 09:00 in Paris (in summer). Counting in UTC
    # emptied the counter 7 h too early (incident of 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500
    base_url:          https://generativelanguage.googleapis.com/v1beta
    # `-preview` REMOVED: the alias was served by `gemini-3.1-flash-lite` without anything
    # flagging it, and the sealed fingerprint therefore carried a wrong model name (incident
    # of 2026-09-10, detected by _refuser_substitution_de_modele). The EFFECTIVE model has
    # not changed — only its name is exact again.
    default_model:     gemini-3.1-flash-lite
    weight:            1.0
    concurrency_limit: 2
    disable_timeout:   120

  # Same key 2, model 3.5: the quota being PER MODEL, this is a second bucket of
  # 500. Fed by PROVIDER_KEYS__google2_35, to export at launch from
  # PROVIDER_KEYS__google2 (do not duplicate the secret in a file).
  google_gemini35_key2:
    # Levels taken from ai.google.dev/gemini-api/docs/thinking (2026-09-10).
    thinking_levels:        [minimal, low, medium, high]
    adapter:           google
    # Daily quota reset in Pacific time, NOT in UTC: the Gemini billing day
    # ends at 09:00 in Paris (in summer). Counting in UTC
    # emptied the counter 7 h too early (incident of 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemini-3.5-flash-lite
    weight:            1.0
    concurrency_limit: 2
    disable_timeout:   120

  # Quotas read from the AI Studio dashboard (free tier, 2026-07-21):
  #   RPM 30 · TPM 16,000 · RPD 14,400. The TPM (16k/min) IS the real constraint,
  #   not the RPM or the RPD — hence weight = min(30, 16000/3000)/15 ≈ 0.36 and a
  #   max_tokens_per_request set to the TPM (a request > 16k tokens → HTTP 413).
  #   batch_max_agents then bounds itself at ~tpm/tokens_per_agent (≈ 5 agents).
  google_gemma42_key1:
    adapter:                google
    # Daily quota reset in Pacific time, NOT in UTC: the Gemini billing day
    # ends at 09:00 in Paris (in summer). Counting in UTC
    # emptied the counter 7 h too early (incident of 2026-09-08).
    quota_reset_tz:                America/Los_Angeles
    rpm_limit:              30
    tpm_limit:              16000
    max_tokens_per_request: 16000  # free tier TPM = 16,000 → single request > 16,000 tokens → HTTP 413
    rpd_limit:              14400   # daily request quota (free tier) — AI Studio dashboard
    base_url:               https://generativelanguage.googleapis.com/v1beta
    default_model:          gemma-4-26b-a4b-it
    max_output_tokens:      8192   # completion limit of the Gemma models
    weight:                 0.36   # min(30, 16000/3000)/15 = 5.33/15 — bounded by the TPM
    concurrency_limit:      1
    disable_timeout:        180

  google_gemma43_key1:
    adapter:                google
    # Daily quota reset in Pacific time, NOT in UTC: the Gemini billing day
    # ends at 09:00 in Paris (in summer). Counting in UTC
    # emptied the counter 7 h too early (incident of 2026-09-08).
    quota_reset_tz:                America/Los_Angeles
    rpm_limit:              30
    tpm_limit:              16000
    max_tokens_per_request: 16000  # free tier TPM = 16,000 → single request > 16,000 tokens → HTTP 413
