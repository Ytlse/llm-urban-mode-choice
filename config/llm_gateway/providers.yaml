  #
  # ── LM Studio — local models served by the host (port 1234) ───────────────
  #
  # Added on 2026-09-08. Every model loaded in LM Studio speaks the OpenAI dialect
  # (adapter `openai_compatible`); from the containers, the host is reached via
  # host.docker.internal. Constraints VERIFIED on LM Studio on 2026-09-08:
  #   - `response_format` accepts ONLY json_schema or text — json_object is refused
  #     (« 'response_format.type' must be 'json_schema' or 'text' ») → structured_output: json_schema.
  #   - default_model = identifier as `lms ls` / GET /v1/models gives it; it must be
  #     copied identically into the experiment's `decideur.modele` (strict pinning).
  #   - The context is set at LOADING (4,096 by default: too short):
  #     `make lmstudio-charger MODELE=<id>` loads with 16,384 tokens.
  # Settings, for all the instances below:
  #   - weight 0: OUT OF ROTATION. Neither the cascade (GAMA mode) nor another experiment
  #     touches them; only an experiment pinned on their model (force_provider) calls them.
  #     Without this, the cascade would load several models on the fly (JIT) and saturate
  #     the machine's memory.
  #   - max_tokens_per_request 6000 → 2 agents per request (≈ 4,400 prompt tokens): bounds
  #     the batch WITHOUT throttling the per-minute rate as tpm_limit would.
  #   - rpm_limit 30: never reached locally; the real brake is concurrency_limit.
  #   - no rpd/tpd: a local model has no daily quota.
  #   - wait_timeout 600: CLIENT wait, not routing wait — the gateway does not read it, it
  #     publishes it and the SDK receives it per call. One call at a time ⇒ a task's wait is that
  #     of the QUEUE, not of the generation (40-120 s). With the 120 s default, every task beyond the
  #     first expired and the circuit breaker opened (2026-09-08, Muse Glimmer).
  # The key PROVIDER_KEYS__lmstudio (any value) in .env enables all these instances via
  # docker-compose.yml; empty or absent, they are excluded at startup.
  # Not declared (specialised, out of scope): olmocr-2-7b (OCR), minicpm-v-4_5 (vision),
  # text-embedding-nomic (embeddings). To be completed as downloads come in.
  #
  lmstudio_mistral_small_3_2_key1:
    adapter:                openai_compatible
    structured_output:      json_schema
    schema_in_system:       true
    base_url:               http://host.docker.internal:1234/v1
    default_model:          mistralai/mistral-small-3.2   # 24B, 4 bit, ctx max 131k
    rpm_limit:              30
    max_tokens_per_request: 6000   # 2 agents per request
    max_output_tokens:      4096
    weight:                 0.0    # OUT OF ROTATION: pinning by experiment only
    concurrency_limit:      2
    wait_timeout:           600   # CLIENT wait (s): one call at a time, the tasks queue up
    disable_timeout:        60

