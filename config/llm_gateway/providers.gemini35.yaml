# config/llm_gateway/providers.gemini35.yaml — case study "shock and habit change".
#
# RESTRICTED providers file: `gemini-3.5-flash-lite` and nothing else. Same reason as for
# `providers.gemini31.yaml`: the Google key carries nine instances, and blanking it would remove
# eight others. The only way to have a single model is to declare only that one.
#
# The two instances are copied IDENTICALLY from the full file. They differ by
# their KEY (different Google projects), hence by their quota bucket: 2 x 500 requests/day,
# reset at midnight Pacific time, i.e. 9 am in Paris.
#
# USAGE:
#   LLM_GATEWAY_PROVIDERS_FILE=/app/config/llm_gateway/providers.gemini35.yaml \
#     make run OFFLINE=1 CACHE=0 CHOC=c6_voiture_suspecte
#
# ⚠ This file must NOT become the default file: without a cascade, a Google outage stops
# the run instead of letting it slide onto mistral. That is intended here, and only here.

providers:
  google_gemini35_key1:
    thinking_levels:
    - minimal
    - low
    - medium
    - high
    adapter: google
    quota_reset_tz: America/Los_Angeles
    rpm_limit: 15
    tpm_limit: 250000
    rpd_limit: 500
    base_url: https://generativelanguage.googleapis.com/v1beta
    default_model: gemini-3.5-flash-lite
    weight: 1.0
    concurrency_limit: 2
    disable_timeout: 120
  google_gemini35_key2:
    thinking_levels:
    - minimal
    - low
    - medium
    - high
    adapter: google
    quota_reset_tz: America/Los_Angeles
    rpm_limit: 15
    tpm_limit: 250000
    rpd_limit: 500
    base_url: https://generativelanguage.googleapis.com/v1beta
    default_model: gemini-3.5-flash-lite
    weight: 1.0
    concurrency_limit: 2
    disable_timeout: 120
