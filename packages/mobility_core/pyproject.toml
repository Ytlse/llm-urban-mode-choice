[build-system]
requires = ["setuptools>=77"]   # PEP 639 : license = expression SPDX + license-files
build-backend = "setuptools.build_meta"

[project]
name = "mobility-core"
description = "Domaine de l'enquête EMC² Toulouse : couronnes, zones fines, hiérarchie des modes, équipement, logement, cadrage de population. Aucune dépendance LLM."
readme = "README.md"
license = "Apache-2.0 OR GPL-2.0-or-later"
license-files = ["LICENSE", "LICENSE-GPL-2.0", "NOTICE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyYAML>=6.0",
    "loguru>=0.7,<0.8",
]

[project.optional-dependencies]
# zone_resolver et residence_zone.CommunalZones : jointure point-dans-polygone.
geo = ["geopandas>=1.1,<2", "shapely>=2.0", "pyproj>=3.6", "numpy>=1.26"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
dev = ["ruff>=0.6", "mypy>=1.11", "import-linter>=2.0"]

[tool.setuptools]
package-dir = { "" = "src" }
# `include-package-data` defaults to True since setuptools 61 and is ADDED to `package-data`
# instead of restricting it: any resource placed in `src/mobility_core/data/` went into the
# wheel, explicit list or not (ticket 038). Set to False, only the list below counts.
# Checked on the artefact itself by `tests/test_packaging_licence.py`.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# EXPLICIT LIST, NO GLOB (ticket 038). A `data/*.json` picks up every file present on disk
# at build time, including those that `.gitignore` excludes because they derive from the
# ProGEDO lil-1750 microdata (restricted access): `zf_housing_type.json` went into the wheel
# that way. Any resource added here is added knowingly;
# `tests/test_packaging_licence.py` fails if a restricted resource reappears.
mobility_core = [
    "py.typed",
    # Fitted model parameters (intercept + coefficients), no table of observations.
    "data/bike_ownership.json",
    "data/driving_license.json",
    "data/pt_subscription.json",
    # Aggregated at ring or study-area level, large counts.
    "data/car_availability_emc2.json",
    "data/terminal_time_emc2.json",
    # From the published AUAT/CEREMA report (p. 53).
    "data/mode_hierarchy_emc2.json",
    # Study area of the 453 communes — status to be confirmed with ADISP (ticket 038).
    "data/commune_couronne.json",
    "data/couronne_perimetre.geojson",
    # RESTRICTED, never listed here: zf_couronne.json, zf_housing_type.json,
    # zf_zones.gpkg, zf_zones.meta.json.
]

[tool.setuptools.dynamic]
version = { attr = "mobility_core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: tests purs, sans ressource externe",
    "needs_data: tests qui exigent une ressource produite hors git (zf_zones.gpkg, feature_spec.json)",
    "slow: tests qui construisent un artefact (sdist/wheel) — quelques secondes",
]
filterwarnings = [
    "error::DeprecationWarning:mobility_core.*",
]

[tool.coverage.run]
source = ["mobility_core"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
