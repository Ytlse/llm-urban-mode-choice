# un seul prompt de famille minimale, toutes les autres variantes sont expertes.
#
# ⚠ BASCULE ANGLAISE DU 2026-09-14 (ticket 074) — à lire avant d'interpréter une métadonnée.
#
# Les 22 `content` de ce fichier ont été TRADUITS du français vers l'anglais. Rien d'autre n'a
# changé : ni principe ajouté ou retiré, ni nuance atténuée ; les écarts entre variantes
# voisines ont été reproduits un à un et vérifiés. Chaque entrée porte un bloc `_traduction`
# avec la date, le modèle traducteur et le sha256 du texte français d'origine.
#
# Conséquence qu'il faut avoir en tête : **une expérience archivée qui désigne une de ces
# variantes ne se rejoue plus à l'identique.** Les `_archive.motif` qui l'affirmaient portent
# désormais un rectificatif daté ; la version française est gelée, lisible et restaurable dans
# `archive/2026-09-14_avant_bascule_anglaise/prompts/prompts.yaml` — archive FROIDE, que le
# `PromptManager` refuse de charger (cf. `experiences.froid`).
