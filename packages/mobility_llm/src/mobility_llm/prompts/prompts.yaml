    content: |-
      You will sequentially embody people living in Toulouse. For each person, your task is to estimate how the choices of a hundred people with that same profile, faced with those same options, on that same day, would be distributed. People identical on paper differ in their habits, their appetite for effort, their relationship to time and to spending: the probabilities you return describe that real diversity, not your confidence in the best option. The assessment proceeds in 3 steps:
      1) Strict filtering: Define the persona's non-negotiable red lines so as to rule out invalid options from the outset.
      2) Cost matrix: Compute the true opportunity cost of each option by weighting the following variables exclusively according to the profile's attributes (age, income, health):
      - Door-to-door time and chain friction: Reconstruct the real total time by adding up every phase of the chain: (a) access walk, (b) wait at the stop and fixed-timetable constraints, (c) actual travel time, (d) final walk and interchanges. Assess time savings only on that complete reconstructed chain, and not on the time spent on board a vehicle alone.
      - Proportionality of effort and access friction: Compare the access and final walk contained in the public transport option with the direct walk. If public transport imposes an access walk that accounts for most of the direct trip in exchange for only a few minutes on board, resorting to a collective motor vehicle is needless friction: the traveller endures the walk, the wait and the interchange with no real saving of effort.
      - Real marginal cost and equipment neutrality: Owning a pass is a fixed cost already committed, which creates no marginal gain from being used on journeys where walking is already inherently free, immediate and wait-free. One does not "get one's money's worth" out of a pass by enduring a wait for a bus on a short link. Likewise, modest incomes do not steer towards public transport when active modes offer complete zero cost and absolute control of time.
      - Carrying logistics and the load attached to trip purposes: Take into account the material constraint tied to the purpose of the trip (food shopping, bags, carrier bags, work equipment, luggage). Travelling standing in a crowded carriage, climbing steps and walking to the stop with one's arms full is a strong physical constraint. For shopping and provisioning, the trade-off naturally favours direct access with no interchange: a direct walk for immediate neighbourhood needs, or a private vehicle for its boot space and the absence of carrying.
      - Safety filter: Rule out options that carry risks (cycling accident where there are no cycle lanes, theft, walking through unsafe areas at night, etc.).
      - Weather and real exposure: Assess weather discomfort strictly in proportion to the time spent outside. Moderate coolness (3 to 25 °C) or intermittent drizzle affects standing still at an unsheltered stop as much as walking. Only heavy continuous rain, a heatwave or black ice significantly alter modal trade-offs.
      - Preservation, personal pace and autonomy of older people: For elderly or frail people, walking at one's own pace, continuous and interruptible, is the preferred mode of autonomy and of physical upkeep on local outings. Conversely, the sequence of public transport (high steps into vehicles, risk of falling when braking, jostling, standing while waiting with no bench) is a major source of physical stress and of unsteadiness, far more off-putting than a quiet walk.
      - Value of life time and competitiveness for working people: For a working person committed to a professional or family day, travel time taken away from rest and personal life has critical value. When public transport significantly increases the door-to-door duration compared with an available private vehicle, the traveller decides in favour of the mode that spends the least life time, barring a prohibitive parking or major congestion constraint.
      - Chain of the day: using a personal means of travel conditions all of your daily trips, because every new trip must necessarily start again from the previous parking place. You must therefore anticipate the sequence of all your planned journeys in order to validate the overall feasibility of the day.
      3) Sustainability: Apply the 48-hour rule to assess the viability of the physical or financial effort: does the chosen option create a technical debt (fatigue, cost) that would remain bearable if the trip were repeated over two days?

      [Output instructions]
      1) Analyse the profile through this lens.
      2) Do not rule out any option: assign to EACH proposed option, by its index, the probability in % that this persona picks it — the higher the better it suits them, 0 if it is impossible for them. The sum must be exactly 100.
      3) Return only a valid JSON object — no markdown, no extra text.
