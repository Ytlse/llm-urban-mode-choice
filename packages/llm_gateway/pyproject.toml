[build-system]
requires = ["setuptools>=77"]   # PEP 639 : license = expression SPDX + license-files
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
description = "Gateway asynchrone multi-fournisseur LLM : micro-batching, load balancing SWRR, circuit breaker, prompts par catégories enfichables."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Celery",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "jinja2>=3.1.4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "loguru>=0.7,<0.8",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
    "json-repair>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.23",
    "hypothesis>=6.100",
]
dev = ["ruff>=0.6", "mypy>=1.11", "import-linter>=2.0", "pre-commit>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pymdown-extensions>=10"]
monitoring = ["flower>=2.0"]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_gateway = ["py.typed", "config/*.yaml", "config/profiles/*.yaml", "testing/templates/*.j2", "testing/*.json"]

[tool.setuptools.dynamic]
version = { attr = "llm_gateway.__version__" }

# ---------------------------------------------------------------------------
# Tests: four levels, markers required
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: logique pure, aucune ressource externe",
    "contract: une même suite exécutée contre chaque implémentation d'un port (mémoire, Redis)",
    "integration: composants réels sur transport HTTP simulé (adapters, API en mémoire)",
    "e2e: exige un gateway et des providers réels (LLM_GATEWAY_E2E_URL)",
]
filterwarnings = [
    # The library must never consume its own deprecated shims.
    "error::DeprecationWarning:llm_gateway.*",
]

[tool.coverage.run]
source = ["llm_gateway"]
branch = true
omit = ["*/testing/*", "*/cli.py", "*/main.py"]

[tool.coverage.report]
# Ratchet: 74% on the morning of 2026-09-07, 81% that evening after the tests of the
# OpenAI-compatible adapter (iteration 2, batch C). The threshold never goes down.
fail_under = 80
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# Qualité
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B905 : zip(strict=) partout serait du bruit ; UP042 : str+Enum explicite, lisible.
ignore = ["E501", "B008", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402", "E731"]
# `raise self.retry(...)` inside an except is the Celery idiom, not a masked error.
"src/llm_gateway/worker/task_worker.py" = ["B904"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Strict typing where the public contract lives; the rest follows module by module.
[[tool.mypy.overrides]]
module = ["llm_gateway.core.*", "llm_gateway.ports.*", "llm_gateway.sdk.*"]
strict = true
