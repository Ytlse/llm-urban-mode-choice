# Workspaces of the experiment registry — spec `espaces-de-travail-experiences.md`.
#
# A workspace is a VIEW, never a filing: adding an experiment to it or removing one does not
# move, rename or delete anything on the disk (R7).
#
# An experiment's name is computed from its parameters (spec `nommage-canonique-experiences`):
# so it cannot carry its phase. The `phase` label below is what makes the link,
# and it exists only in this view (R6a).
#
# A name without a directory on the disk is not an error: the row is shown as expected
# and the registry counts the missing ones (R9). This file fails OPEN: if it is unreadable,
# the registry opens on « Toutes les expériences » (R13).
version: espaces1
espaces:
  - nom: papier version courte
    note: >-
      Ticket 103 — le carré Jev × Gemini hors échantillon sur la cohorte c2, et trois graines
      par décideur clé sur c1. Les entrées « Acquis (c1) » sont déjà mesurées : elles ne sont
      pas à rejouer, elles sont là parce que les nouvelles ne se lisent pas sans elles (une
      mesure c2 ne se compare pas à une bande c1).
    entrees:

      # ── Phase 1 — the scale of c2 ─────────────────────────────────────────────────
      # Deterministic and free, they go FIRST: without the ceiling and the floor
      # of c2, no row of phases 2 and 3 can be read (ticket 103, § 1).
      - experience: exp_mnl_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_lgbm_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_klr_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_rf_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
        note: >-
          Lanceur dédié et chemin de population HÔTE : la forêt a été estimée sous
          scikit-learn 1.8.0 et le conteneur porte la 1.9.0 (cf. campagne `rejeu_jeu_corrige_v6`).
      - experience: exp_alea_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_majvoiture_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_durmin_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2

      # ── Phase 2 — Jev on c2 ────────────────────────────────────────────────────────
      # Five minutes and ~$0.35 for the three. `proexp32` is the pivotal out-of-sample
      # result: it is the one that question Q1 of the ticket examines.
      - experience: exp_jev-1130_promin02_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 2 — Jev sur c2
      - experience: exp_jev-1130_proexp05_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 2 — Jev sur c2
      - experience: exp_jev-1130_proexp32_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 2 — Jev sur c2
        note: Résultat pivot hors échantillon (Q1).

      # ── Phase 3 — Gemini on c2 ─────────────────────────────────────────────────────
      # The only real cost of the plan: ~4 h and ~630 requests of free quota.
      - experience: exp_gemini-35-fl_proexp05_jtir_pop-1000_PANEL_v6_c2_jeu-20260316_EN_c_t0_nosim
        phase: Phase 3 — Gemini sur c2
        note: Déclarée le 22/09 à 13 h 42, jamais exécutée.
