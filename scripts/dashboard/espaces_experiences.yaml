        phase: Phase 3 — Gemini sur c2
        note: >-
          La ligne qui rend le carré carré : le prompt réglé pour Jev, servi à Gemini (Q2).
          Sans elle on ignore si l'avantage tient au texte ou au modèle qui le lit.

      # ── Phase 4 — three seeds per key decision-maker, on c1 ────────────────────────
